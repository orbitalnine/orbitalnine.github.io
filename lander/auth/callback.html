<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lander — Discord sign-in</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, sans-serif;
            background: #111827;
            color: #f9fafb;
        }

        body {
            display: grid;
            min-height: 100vh;
            place-items: center;
            margin: 0;
        }

        main {
            width: min(28rem, calc(100% - 3rem));
            text-align: center;
        }

        h1 {
            margin-bottom: 0.5rem;
        }

        p {
            color: #cbd5e1;
            line-height: 1.5;
        }

        .error {
            color: #fca5a5;
        }
    </style>
</head>
<body>
    <main>
        <h1 id="title">Completing Discord sign-in…</h1>
        <p id="message">You can return to Lander once this is finished.</p>
    </main>

    <script>const functionUrl =
            "https://yjzybgzqumczzkyezaij.supabase.co/functions/v1/lander-oauth-handoff";

        const title = document.getElementById("title");
        const message = document.getElementById("message");
        const parameters = new URLSearchParams(window.location.search);

        const code = parameters.get("code");
        const handoffState = parameters.get("handoff_state");
        const authError = parameters.get("error");
        const authErrorCode = parameters.get("error_code") || authError;
        const authErrorDescription = parameters.get("error_description");

        async function completeHandoff() {
            if (!handoffState || (!code && !authErrorCode)) {
                throw new Error("The sign-in response was incomplete. Return to Lander and try again.");
            }

            const body = {
                action: "complete",
                state: handoffState
            };
            if (code) {
                body.code = code;
            } else {
                body.error_code = authErrorCode;
                body.error_description = authErrorDescription || authErrorCode;
            }

            const response = await fetch(functionUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                const body = await response.json().catch(() => ({}));
                throw new Error(body.error || "Could not complete the Lander sign-in request.");
            }

            title.textContent = authErrorCode
                ? "Returning to Lander"
                : "Discord sign-in complete";
            message.textContent = "Return to Lander. The game will finish signing you in automatically.";
        }

        completeHandoff().catch((error) => {
            title.textContent = "Discord sign-in failed";
            message.textContent = error.message;
            message.classList.add("error");
        });</script>
</body>
</html>
